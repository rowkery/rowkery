name: Create DMG

# Builds an unsigned universal DMG (Apple Silicon + Intel) with `make dmg universal`
# and uploads it as the run's artifact. Manual only: Actions > Create DMG > Run workflow.
# The repo secret VITE_ROWKERY_REPORT_URL (the report relay's /report URL, see
# apps/relay/README.md) is baked in so Help > Report an Issue can send.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the version; `make dmg universal` adds both Mac targets.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: make dmg universal
        env:
          VITE_ROWKERY_REPORT_URL: ${{ secrets.VITE_ROWKERY_REPORT_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Rowkery-${{ github.sha }}
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
