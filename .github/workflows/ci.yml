name: CI

on:
  workflow_dispatch:
  # The pull_request and push triggers are off: workflows run manually (Actions > CI > Run workflow).
  # pull_request:
  # push:
  #   branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rowkery
          POSTGRES_PASSWORD: rowkery
          POSTGRES_DB: rowkery
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U rowkery -d rowkery"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ROWKERY_PG_HOST: 127.0.0.1
      ROWKERY_PG_PORT: 54329
      ROWKERY_PG_USER: rowkery
      ROWKERY_PG_PASSWORD: rowkery
      ROWKERY_PG_DB: rowkery
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf postgresql-client
      - name: Typecheck and unit tests (app)
        working-directory: apps/rowkery-tauri
        run: |
          npm ci
          npm run typecheck
          npx vitest run
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # postgres_window_switches_database switches the window to a second database.
      - name: Second test database
        run: PGPASSWORD=rowkery psql -h 127.0.0.1 -p 54329 -U rowkery -d rowkery -c "CREATE DATABASE orders"
      - name: cargo test (with the Postgres integration tests)
        run: cargo test --workspace --features rowkery-core/postgres-integration,rowkery-mcp/postgres-integration
      - name: Website build
        working-directory: apps/web
        run: |
          npm ci
          npm run build

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p rowkery-tauri
