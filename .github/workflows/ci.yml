name: CI

# The quality gate on every pull request and every push to main; a pull
# request merges only when it's green. Browser and latency proofs stay
# local (AGENTS.md). Fork pull requests get a read-only token and no secrets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rowkery
          POSTGRES_PASSWORD: rowkery
          POSTGRES_DB: rowkery
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U rowkery -d rowkery"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      ROWKERY_PG_HOST: 127.0.0.1
      ROWKERY_PG_PORT: 54329
      ROWKERY_PG_USER: rowkery
      ROWKERY_PG_PASSWORD: rowkery
      ROWKERY_PG_DB: rowkery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf postgresql-client
      - name: Typecheck and unit tests (app)
        working-directory: apps/rowkery-tauri
        run: |
          npm ci
          npm run typecheck
          npx vitest run
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # postgres_window_switches_database switches the window to a second database.
      - name: Second test database
        run: PGPASSWORD=rowkery psql -h 127.0.0.1 -p 54329 -U rowkery -d rowkery -c "CREATE DATABASE orders"
      - name: cargo test (with the Postgres integration tests)
        run: cargo test --workspace --features rowkery-core/postgres-integration,rowkery-mcp/postgres-integration
      - name: Website build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      # No dependencies: Node runs the TypeScript tests itself (22.18 and later).
      - name: Report relay tests
        working-directory: apps/relay
        run: npm test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check -p rowkery-tauri

  # Known advisories, licences and sources of every crate (deny.toml), and
  # high or critical npm advisories in what the app, the sites and the relay
  # ship. A new advisory turns this red on any pull request until it's fixed
  # or ignored in deny.toml with its reason.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npm audit
        run: |
          for dir in apps/rowkery-tauri apps/web apps/docs apps/relay; do
            echo "::group::$dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
            echo "::endgroup::"
          done
