name: Claude

# Mention @claude in a pull request or issue comment (for example
# "@claude review") and Claude Code answers there. Only people with write
# access can trigger it (the action checks), so the API key never runs for a
# stranger's comment. Billed per token to the ANTHROPIC_API_KEY secret.
#
# It uses the workflow's own token, so the job's permissions below are all it
# has: it can read the code and comment, but it can't push.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read # to read CI results on pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --append-system-prompt "Follow the project rules in AGENTS.md. When asked to review, report correctness and security bugs first, with file and line, and skip style nits."

      # The action hides Claude's output (it can hold file contents), so a
      # failed run says only "is_error". Print just the error, such as an
      # invalid key or a low credit balance.
      - name: Why Claude failed
        if: failure() && steps.claude.outcome == 'failure'
        run: |
          log="$RUNNER_TEMP/claude-execution-output.json"
          [ -f "$log" ] || { echo "no output log"; exit 0; }
          jq -r 'if type == "array" then .[] else . end
            | select((.type == "assistant" and .error != null) or (.type == "result" and .is_error == true))
            | if .type == "assistant"
              then "API error (\(.error)): \([.message.content[]? | .text? // empty] | join(" "))"
              else "Result: \(.result // .subtype)"
              end' "$log"
