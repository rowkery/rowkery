name: Latency (WebView2)

# The latency proof on Windows: builds the release binary with the latency
# proof steps, runs scripts/latency-proof.sh under WebView2 against a
# Postgres on the runner (port 54329, user/db/password rowkery, seeded with
# scripts/test-seed.sql) and uploads the ledger and the baseline.
#
# Gating, once per release: the run fails on any miss of the remote budgets
# in scripts/budgets.json (LATENCY_BUDGETS=remote, LATENCY_FAIL_ON_MISS=1),
# not only on a regression. A remote budget of null means 1 RTT + 10 ms; the
# RTT is the `rtt_ms` input (0 for the runner's own Postgres).
#
# Manual only, like dmg.yml: Actions > Latency (WebView2) > Run workflow.
on:
  workflow_dispatch:
    inputs:
      rtt_ms:
        description: "Round trip to the database in ms (remote budgets of null are 1 RTT + 10 ms)"
        required: false
        default: "0"
      record_only:
        description: "Record the ledger without failing on a miss (a first Windows run)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  latency:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      LATENCY_BUDGETS: remote
      LATENCY_RTT_MS: ${{ inputs.rtt_ms }}
      LATENCY_FAIL_ON_MISS: ${{ inputs.record_only && '0' || '1' }}
      LATENCY_ENFORCE: ${{ inputs.record_only && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rust-toolchain.toml pins the version.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Postgres on 54329
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: rowkery
          password: rowkery
          database: rowkery
          port: 54329
      - name: Postgres tools on PATH, output folder
        run: |
          if [ -n "${PGBIN:-}" ]; then echo "$PGBIN" >> "$GITHUB_PATH"; fi
          echo "ROWKERY_LATENCY_OUT=$(cygpath -u "$RUNNER_TEMP")/latency" >> "$GITHUB_ENV"
      - name: Install app dependencies
        working-directory: apps/rowkery-tauri
        run: npm ci
      - name: Latency proof
        env:
          PGPASSWORD: rowkery
        run: scripts/latency-proof.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: latency-webview2-${{ github.sha }}
          path: |
            ${{ runner.temp }}/latency
            scripts/baselines/*-win32-*.json
          if-no-files-found: warn
