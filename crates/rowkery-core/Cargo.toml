[package]
name = "rowkery-core"
version.workspace = true
edition = "2021"
publish = false
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
csv = "1"
futures = "0.3"
getrandom = { version = "0.4", features = ["sys_rng"] }
memchr = "2"
# MySQL and MariaDB: pure Rust, TLS on the same rustls + ring as Postgres.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "tls12", "ring"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
rand = "0.8"
rand_core_010 = { package = "rand_core", version = "0.10", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query", "system-proxy"] }
ring = "0.17"
# The RSA key the connector's client certificate is signed for (russh already builds it).
rsa = { version = "0.10.0-rc.18", default-features = false, features = ["std", "encoding"] }
rusqlite = { version = "0.32", features = ["bundled", "column_decltype", "hooks"] }
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
jiff = "0.2"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
socket2 = "0.6"
webpki-roots = "1"
rustls-native-certs = "0.8"

[dev-dependencies]
rcgen = { version = "0.14", features = ["x509-parser"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "register_pg"
path = "examples/register_pg.rs"

[features]
postgres-integration = []
mysql-integration = []
