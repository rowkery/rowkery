services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rowkery
      POSTGRES_PASSWORD: rowkery
      POSTGRES_DB: rowkery
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rowkery -d rowkery"]
      interval: 2s
      timeout: 5s
      retries: 15

  ssh-bastion:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      PASSWORD_ACCESS: "true"
      USER_PASSWORD: rowkeryssh
      USER_NAME: rowkery
    ports:
      - "2222:2222"
    depends_on:
      postgres:
        condition: service_healthy
