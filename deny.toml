# cargo-deny, run by CI's audit job: `cargo deny check advisories licenses sources`.

[graph]
# What ships (the same targets as scripts/notices/about.toml).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
exclude-dev = true

[advisories]
yanked = "warn"
# Each ignore says why it can't reach a user, or why there's nothing to take
# yet. Remove it when a fixed release lands.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa via russh and the Cloud SQL connector: timing attack on RSA decryption; no fixed release exists, the SSH client only signs, and the connector only makes its key with it (ring signs)" },
    { id = "RUSTSEC-2026-0367", reason = "zip via tauri-plugin-updater, Windows only: unpacks an update only after its signature checks; no updater release uses zip >= 9 yet" },
    { id = "RUSTSEC-2026-0368", reason = "zip via tauri-plugin-updater, as RUSTSEC-2026-0367" },
    { id = "RUSTSEC-2026-0369", reason = "zip via tauri-plugin-updater, as RUSTSEC-2026-0367" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (merged into zbus 6): D-Bus under tauri-plugin-notification, Linux only; no notify-rust release uses zbus 6 yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, as RUSTSEC-2026-0370" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, as RUSTSEC-2026-0370" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained: a build-time macro under Tauri's Linux GTK stack" },
]

[licenses]
# The licences scripts/notices/about.toml accepts, less the ones nothing uses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
