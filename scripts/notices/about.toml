# cargo-about's config for scripts/notices.mjs: the licences we accept, in
# the order one is picked when a crate offers a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "BSD-1-Clause",
]
# What ships: the app for macOS, Linux and Windows, not tests or build scripts.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
